<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
        }

        .header {
            background: #222;
            color: white;
            padding: 25px;
        }

        .content {
            background: white;
            width: 70%;
            max-width: 600px;
            margin: 80px auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background: #444;
        }

        .footer {
            color: #777;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>My Personal Website</h2>
    </div>

    <div class="content">
        <h1>Welcome! 👋</h1>

        <p>This is my website.</p>

        <p>My name is Saranya.</p>

        <a href="#" class="button">Explore My Website</a>
    </div>

    <div class="footer">
        <p>Created using GitHub Pages</p>
    </div>

</body>
</html>
